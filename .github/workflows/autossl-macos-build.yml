name: AutoSSL macOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '.github/workflows/autossl-macos-build.yml'
      - '**'
  pull_request:
    paths:
      - '.github/workflows/autossl-macos-build.yml'
      - '**'

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Build macOS bundles
        run: npm run electron:build:mac

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: autossl-macos-bundle
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
