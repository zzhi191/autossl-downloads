name: AutoSSL Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create, for example autossl-v1.0.0
        required: true
  push:
    tags:
      - 'autossl-v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Validate release tag
        id: validate
        run: |
          node -e "const tag = process.env.RELEASE_TAG || ''; if (!/^autossl-v\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$/.test(tag)) { console.error('Invalid release tag:', tag); console.error('Expected format: autossl-v1.0.0'); process.exit(1) } console.log('Validated release tag:', tag)"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run electron:build:win

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: autossl-windows-bundle
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Build macOS bundles
        run: npm run electron:release:mac

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: autossl-macos-bundle
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error

  publish-release:
    needs:
      - prepare
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: autossl-windows-bundle
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: autossl-macos-bundle
          path: release-assets/macos

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          name: AutoSSL ${{ needs.prepare.outputs.release_tag }}
          body: |
            Desktop bundle for AutoSSL.

            Included artifacts:
            - Windows NSIS installer (.exe)
            - macOS DMG installer (.dmg)
            - macOS archive (.zip)
            - Electron updater metadata (.yml, .blockmap)
          files: |
            release-assets/windows/**/*
            release-assets/macos/**/*
